name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/syafwaniqbalfauzi/syafwan-web:latest
            ghcr.io/syafwaniqbalfauzi/syafwan-web:${{ github.sha }}
          build-args: |
            PUBLIC_SITE_URL=https://syafwan.sejarahpersib.com
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Ship compose file and deploy on the VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd ~/syafwan
            git pull --ff-only
            # Migrasi sekali jalan: service dulu bernama `web`/`directus` (alias DNS bentrok dengan
            # sejarah-persib). Compose tidak bisa mengganti nama service dengan container_name tetap
            # ("name already in use"), jadi hapus container lama HANYA bila labelnya masih nama lama.
            # Idempoten: setelah migrasi, langkah ini tidak melakukan apa-apa.
            for pair in "syafwan-web:web" "syafwan-directus:directus"; do
              c=${pair%%:*}; old=${pair##*:}
              cur=$(docker inspect -f '{{index .Config.Labels "com.docker.compose.service"}}' "$c" 2>/dev/null || true)
              if [ "$cur" = "$old" ]; then echo "migrasi: hapus $c (service lama $old)"; docker rm -f "$c"; fi
            done
            docker compose -f docker-compose.prod.yml pull syafwan-web
            docker compose -f docker-compose.prod.yml up -d --wait
            docker image prune -f --filter "until=168h"
