# Production stack on the VPS (sejarah-persib). Joins the existing internal network so
# the shared Caddy can reach `syafwan-web` and `syafwan-directus`. No published ports.
#
# PENTING: nama service di bawah SENGAJA `syafwan-web` / `syafwan-directus`, bukan `web` /
# `directus`. Docker Compose memberi tiap service alias DNS sesuai nama service-nya di SEMUA
# network yang diikutinya. Network `sejarah-persib_internal` dipakai bersama stack
# sejarah-persib yang juga punya service `web` dan `directus`; dengan nama yang sama, DNS
# Docker menjawab bergantian antar-proyek (Caddy `web:3000` dan Nuxt `http://directus:8055`
# kadang nyasar ke container proyek ini -> 500 /api/search-index, halaman salah). Jangan
# dikembalikan ke nama generik selama network ini dibagi.
# Secrets live in ~/syafwan/.env on the server (never committed).
name: syafwan

services:
  syafwan-directus:
    image: directus/directus:11.17.4
    container_name: syafwan-directus
    restart: unless-stopped
    mem_limit: 320m
    environment:
      KEY: ${DIRECTUS_KEY}
      SECRET: ${DIRECTUS_SECRET}
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD}
      PUBLIC_URL: ${DIRECTUS_PUBLIC_URL}
      DB_CLIENT: pg
      DB_HOST: ${SUPABASE_DB_HOST}
      DB_PORT: ${SUPABASE_DB_PORT}
      DB_DATABASE: ${SUPABASE_DB_DATABASE}
      DB_USER: ${SUPABASE_DB_USER}
      DB_PASSWORD: ${SUPABASE_DB_PASSWORD}
      DB_SSL__REJECT_UNAUTHORIZED: "false"
      DB_POOL__MIN: "1"
      DB_POOL__MAX: "4"
      STORAGE_LOCATIONS: local
      STORAGE_LOCAL_ROOT: ./uploads
      CACHE_ENABLED: "false"
      WEBSOCKETS_ENABLED: "false"
      RATE_LIMITER_ENABLED: "true"
      TELEMETRY: "false"
    volumes:
      - ./uploads:/directus/uploads
    networks:
      - internal

  syafwan-web:
    image: ghcr.io/syafwaniqbalfauzi/syafwan-web:latest
    container_name: syafwan-web
    restart: unless-stopped
    mem_limit: 160m
    # Same user as the VPS account, so the web app can read the agent's picture folders below
    # (they are private to that user). The app writes nothing to disk.
    user: "${WEB_UID:-1001}:${WEB_GID:-1001}"
    volumes:
      # Pictures the agent mentions in a chat reply (MEDIA:/path). Read-only; see web/src/lib/chat-media.ts.
      - ${HERMES_HOME:-/home/syafwan/.hermes}/cache/scratch:/media/scratch:ro
      - ${HERMES_HOME:-/home/syafwan/.hermes}/cache/images:/media/images:ro
    depends_on:
      - syafwan-directus
    environment:
      NODE_ENV: production
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL}
      PUBLIC_CMS_URL: ${PUBLIC_CMS_URL}
      DIRECTUS_INTERNAL_URL: ${DIRECTUS_INTERNAL_URL}
      DIRECTUS_TOKEN: ${DIRECTUS_TOKEN}
      # Create-only token for the Autoplay Blocker report form. Unset = the form says it is unavailable.
      DIRECTUS_REPORT_TOKEN: ${DIRECTUS_REPORT_TOKEN:-}
      # Google Analytics 4 Measurement ID. Unset = no tracking.
      PUBLIC_GA_ID: ${PUBLIC_GA_ID:-}
      # Hermes API server on the VPS host (docker bridge gateway). Unset key disables /agent.
      HERMES_API_URL: ${HERMES_API_URL:-http://172.18.0.1:8642}
      HERMES_API_KEY: ${HERMES_API_KEY:-}
    networks:
      - internal

networks:
  internal:
    external: true
    name: sejarah-persib_internal
